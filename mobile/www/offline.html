<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Không có kết nối</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
             font-family: Inter, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f8fc; color: #0f3963; text-align: center; }
      .box { max-width: 340px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #52657a; font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
      button { border: 0; border-radius: 999px; padding: 12px 22px; background: #0f3963; color: #fff; font-size: 15px; font-weight: 600; }
      a { color: #1a6fe0; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Không kết nối được</h1>
      <p>App cần mạng để xem danh mục sản phẩm, đơn hàng và tin nhắn. Kiểm tra Wi‑Fi hoặc dữ liệu di động rồi thử lại.</p>
      <button type="button" onclick="retry()">Thử lại</button>
      <p style="margin-top:20px;font-size:13px">Cần hỗ trợ: <a href="tel:0975206800">0975 206 800</a></p>
    </div>
    <script>
      // Tự thử lại: mạng có lại thì mở trang ngay; mạng chập chờn lúc mở app (máy ảo thử 01/11/2026 gặp trang này ngay lần
      // mở đầu) thì tự thử sau 3, 6, 12 giây — tối đa 3 lần mỗi 2 phút để website hỏng thật không quay vòng mãi.
      var SITE = "https://duoc365.com";
      function retry() { location.href = SITE; }
      window.addEventListener("online", retry);
      try {
        var now = Date.now();
        var tries = JSON.parse(sessionStorage.getItem("lp_offline_tries") || "[]").filter(function (t) { return now - t < 120000; });
        if (tries.length < 3) {
          var wait = 3000 * Math.pow(2, tries.length);
          tries.push(now + wait);
          sessionStorage.setItem("lp_offline_tries", JSON.stringify(tries));
          setTimeout(function () { if (navigator.onLine !== false) retry(); }, wait);
        }
      } catch (e) {}
    </script>
  </body>
</html>
