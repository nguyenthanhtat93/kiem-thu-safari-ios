# App iOS Dược365 (mobile/ của repo duoc365, chép sang repo công khai kiem-thu-safari-ios bằng scripts/thu-app-ios.sh
# vì repo riêng tư không chạy được Actions máy Mac). Dựng không ký cho máy ảo một lần rồi thử như người dùng trên
# iPhone nhỏ, iPhone lớn nhất và iPad (app iPhone chạy chế độ tương thích — Apple duyệt cả trên iPad): Maestro bấm/gõ,
# thông báo đẩy giả lập, giao diện tối, chữ lớn, soát văng app / WebView dừng. Chạy tay: gh workflow run app-ios.yml
name: App iOS
on:
  workflow_dispatch:
    inputs:
      viec:
        description: "kiem-tra: thử trên máy ảo; testflight: dựng Release, ký, tải lên App Store Connect"
        type: choice
        options: [kiem-tra, testflight]
        default: kiem-tra
jobs:
  app-ios:
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Chọn Xcode mới nhất (Apple bắt dựng bằng iOS 26 SDK từ 28/04/2026)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)"
          xcodebuild -version | tee "$RUNNER_TEMP/xcode.txt"
          xcodebuild -showsdks | grep -i iphoneos | tee -a "$RUNNER_TEMP/xcode.txt"
      - name: Cài Capacitor
        run: npm ci
      - name: Đồng bộ Xcode project
        run: npm run ios:sync
      - name: Soát yêu cầu App Store
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: if [ "${{ inputs.viec }}" = "testflight" ]; then npm run check; else npm run check -- --bo-qua-team; fi
      - name: Dựng cho máy ảo (một lần)
        if: ${{ inputs.viec != 'testflight' }}
        run: |
          mkdir -p "$RUNNER_TEMP/ket-qua"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build \
            > "$RUNNER_TEMP/ket-qua/xcodebuild.log" 2>&1 || { tail -n 80 "$RUNNER_TEMP/ket-qua/xcodebuild.log"; exit 1; }
          grep -E "warning:" "$RUNNER_TEMP/ket-qua/xcodebuild.log" | grep -v "/node_modules/\|SourcePackages" | sort -u | head -40 || true
          echo "APP_PATH=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name App.app -type d | head -1)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        if: ${{ inputs.viec != 'testflight' }}
        with: { distribution: temurin, java-version: "17" }
      - name: Cài Maestro
        if: ${{ inputs.viec != 'testflight' }}
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Thử trên iPhone nhỏ, iPhone lớn, iPad
        if: ${{ inputs.viec != 'testflight' }}
        env:
          USERNAME: ${{ secrets.APP_REVIEW_USERNAME }}
          PASSWORD: ${{ secrets.APP_REVIEW_PASSWORD }}
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          xcrun simctl list devices available
          # Máy ảo mới nhất khớp mẫu đầu tiên có sẵn.
          pick() { for pat in "$@"; do n="$(xcrun simctl list devices available | grep -E "$pat" | tail -1 | sed -E 's/^ *(.*) \([0-9A-F-]{36}\).*/\1/')"; [ -n "$n" ] && { echo "$n"; return; }; done; }
          status=0
          { echo "## App iOS trên máy ảo"; sed 's/^/    /' "$RUNNER_TEMP/xcode.txt"; } >> "$GITHUB_STEP_SUMMARY"
          for key in nho lon ipad; do
            case $key in
              nho) name="$(pick 'iPhone SE' 'iPhone 1[0-9]e')" ;;
              lon) name="$(pick 'iPhone 1[0-9] Pro Max')" ;;
              ipad) name="$(pick 'iPad Pro 13' 'iPad Air 13' 'iPad \(')" ;;
            esac
            [ -n "$name" ] || { echo "Không có máy ảo cho $key"; continue; }
            echo "== $key: $name"
            OUT="$RUNNER_TEMP/ket-qua/$key" DEVICE_NAME="$name" bash scripts/test-simulator.sh || status=1
            { echo "### $name"; cat "$RUNNER_TEMP/ket-qua/$key/tom-tat.md"; } >> "$GITHUB_STEP_SUMMARY"
            udid="$(xcrun simctl list devices available | grep -F "$name (" | tail -1 | grep -oE '[0-9A-F-]{36}')"
            xcrun simctl shutdown "$udid" || true
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.viec != 'testflight' }}
        with: { name: ket-qua-app-ios, path: "${{ runner.temp }}/ket-qua", retention-days: 14 }
      # Khoá App Store Connect ở Secrets của repo chạy workflow; ghi ra tệp tạm, xoá ngay khi xong (docs/app-store/README.md bước 3b).
      - name: Dựng Release, ký tự động, tải lên App Store Connect
        if: ${{ inputs.viec == 'testflight' }}
        working-directory: mobile/ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          API_KEY: ${{ secrets.APPSTORE_API_KEY }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          for v in TEAM_ID KEY_ID ISSUER_ID API_KEY; do
            [ -n "${!v}" ] || { echo "::error::Thiếu Secret cho $v (docs/app-store/README.md bước 3b)"; exit 1; }
          done
          umask 077
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$API_KEY" > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild archive -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" "${AUTH[@]}" | tail -n 40
          test "${PIPESTATUS[0]}" -eq 0
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$OPTS"
          plutil -insert method -string app-store-connect "$OPTS"
          plutil -insert destination -string upload "$OPTS"
          plutil -insert teamID -string "$TEAM_ID" "$OPTS"
          plutil -insert signingStyle -string automatic "$OPTS"
          plutil -insert uploadSymbols -bool YES "$OPTS"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$OPTS"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$OPTS" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          echo "### Đã tải bản dựng $BUILD_NUMBER lên App Store Connect (5–30 phút sau hiện ở TestFlight)" >> "$GITHUB_STEP_SUMMARY"
      - name: Xoá khoá tạm
        if: ${{ always() && inputs.viec == 'testflight' }}
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
