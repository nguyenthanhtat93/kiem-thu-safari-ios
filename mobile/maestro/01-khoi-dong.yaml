appId: vn.duocphamlinhphuong.app
name: Khởi động app lần đầu, đóng hẳn rồi mở lại
tags: [khach]
---
# Cài mới: xoá dữ liệu cũ, cho sẵn quyền (máy ảo không bấm được hộp thoại hệ thống).
- launchApp:
    clearState: true
    permissions:
      notifications: allow
      camera: allow
      photos: allow
# Màn chờ rồi mở duoc365.com (QC 2.1: không trắng trang). Lần mở đầu sau khi cài cho 120 giây: máy ảo GitHub mới cài có lúc
# mất 20 giây chỉ để khởi động tiến trình WebKit (lượt 41328397457: "WebContent process took 20.1 seconds to launch").
- extendedWaitUntil:
    visible: "(?s).*Phân phối dược phẩm.*"
    timeout: 120000
- assertVisible: "Đăng nhập"
- takeScreenshot: 01-khoi-dong
# Đóng hẳn rồi mở lại (khởi động nguội) vẫn vào được.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "(?s).*Phân phối dược phẩm.*"
    timeout: 60000
