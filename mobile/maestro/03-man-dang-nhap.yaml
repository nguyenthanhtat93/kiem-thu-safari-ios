appId: vn.duocphamlinhphuong.app
name: Màn đăng nhập đúng quy định App Store, sai mật khẩu không văng, mở Chính sách
tags: [khach]
---
- launchApp
- extendedWaitUntil:
    visible: "(?s).*Phân phối dược phẩm.*"
    timeout: 60000
- tapOn:
    text: "Đăng nhập"
    index: 0
- extendedWaitUntil:
    visible: "Quên mật khẩu\\?"
    timeout: 20000
# 4.8: trong vỏ app không có đăng nhập Google / Facebook / X.
- assertNotVisible: "hoặc đăng nhập bằng"
- assertNotVisible: "Facebook"
- assertNotVisible: "Google"
# Ô Cloudflare Turnstile chạy được trong app (WKAppBoundDomains có cloudflare.com) — trước báo lỗi, không đăng nhập được.
- waitForAnimationToEnd:
    timeout: 15000
- assertNotVisible: "(?s).*Không tải được ô xác minh Cloudflare.*"
# 5.1.1(i): Chính sách bảo mật mở được ngay từ màn đăng nhập.
- assertVisible: "Chính sách bảo mật"
- takeScreenshot: 03-dang-nhap
# Sai mật khẩu phải báo lỗi, không văng app.
- tapOn: "Nick, Gmail hoặc SĐT"
- inputText: "0900000999"
- tapOn: "Mật khẩu"
- inputText: "sai-mat-khau-123"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible: "Quên mật khẩu\\?"
- takeScreenshot: 03-sai-mat-khau
# Bỏ con trỏ khỏi ô nhập bằng cách chạm tiêu đề "Đăng nhập" (index 0, trước nút cùng chữ): hideKeyboard của Maestro không ẩn được
# bàn phím của ô nhập trên web ở iPhone SE (lượt 41367766424: "Couldn't hide the keyboard").
- tapOn:
    text: "Đăng nhập"
    index: 0
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: "Chính sách bảo mật"
    direction: DOWN
    timeout: 10000
- tapOn: "Chính sách bảo mật"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 03-chinh-sach
