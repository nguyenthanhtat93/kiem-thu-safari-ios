appId: vn.duocphamlinhphuong.app
name: Khách chưa đăng nhập cuộn trang chủ, bấm nhóm hàng
tags: [khach]
---
- launchApp
- extendedWaitUntil:
    visible: "(?s).*Phân phối dược phẩm.*"
    timeout: 60000
- takeScreenshot: 02-trang-chu
# Cuộn như người dùng tới dải đối tác cuối trang. Trang có hiệu ứng chạy liên tục (tỉnh tuyển dụng sáng lần lượt, dải logo đối tác)
# nên Maestro chờ màn đứng yên lâu sau mỗi lần vuốt — cho 90 giây (30 giây trượt từ 01/11/2026).
- scrollUntilVisible:
    element: "(?s).*Thuốc tân dược.*"
    direction: DOWN
    timeout: 90000
    speed: 40
    visibilityPercentage: 50
    centerElement: true
- takeScreenshot: 02-nhom-hang
# Bấm nhóm hàng ngay khi tới (trước đây cuộn xuống dải đối tác rồi cuộn ngược lên: ba lần cuộn trên trang có hiệu ứng chạy
# liên tục làm iPhone Pro Max quá 8 phút, lượt 41319166089). Rồi đóng hộp, cuộn tiếp xuống dải đối tác.
- tapOn: "(?s).*Thuốc tân dược.*"
- extendedWaitUntil:
    visible: "Quên mật khẩu\\?"
    timeout: 20000
- takeScreenshot: 02-mo-dang-nhap
# Đóng hộp đăng nhập rồi cuộn tiếp (không mở lại app: sau lần mở lại máy ảo iPhone SE có lúc Maestro mất quyền đọc cửa sổ,
# cây phần tử rỗng dù trang đã hiện — lượt 41350832414).
- tapOn: "Đóng"
- extendedWaitUntil:
    notVisible: "Quên mật khẩu\\?"
    timeout: 20000
- scrollUntilVisible:
    element: "(?s).*Đối tác của chúng tôi.*"
    direction: DOWN
    timeout: 90000
- takeScreenshot: 02-doi-tac
