appId: vn.duocphamlinhphuong.app
name: Khách chưa đăng nhập cuộn trang chủ, bấm nhóm hàng
tags: [khach]
---
- launchApp
- extendedWaitUntil:
    visible: "(?s).*Phân phối dược phẩm.*"
    timeout: 60000
- takeScreenshot: 02-trang-chu
# Cuộn như người dùng tới dải đối tác cuối trang.
- scrollUntilVisible:
    element: "(?s).*Thuốc tân dược.*"
    direction: DOWN
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: true
- takeScreenshot: 02-nhom-hang
- scrollUntilVisible:
    element: "(?s).*Đối tác của chúng tôi.*"
    direction: DOWN
    timeout: 30000
- takeScreenshot: 02-doi-tac
# Nhóm hàng của khách mở màn đăng nhập (giá chỉ cho khách có tài khoản).
- scrollUntilVisible:
    element: "(?s).*Thuốc tân dược.*"
    direction: UP
    timeout: 30000
    speed: 40
    visibilityPercentage: 50
    centerElement: true
- waitForAnimationToEnd
- tapOn: "(?s).*Thuốc tân dược.*"
- extendedWaitUntil:
    visible: "Quên mật khẩu\\?"
    timeout: 20000
- takeScreenshot: 02-mo-dang-nhap
