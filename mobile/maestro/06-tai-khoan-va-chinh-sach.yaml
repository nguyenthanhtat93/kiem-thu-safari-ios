appId: vn.duocphamlinhphuong.app
name: Tab Tài khoản — cài đặt, xoá tài khoản, hỗ trợ, chính sách
tags: [dang-nhap]
---
- launchApp
- extendedWaitUntil:
    visible: "Thông báo.*"
    timeout: 60000
- tapOn: "Tài khoản"
# Trang Tài khoản điện thoại (MobileMore): mục tài khoản liệt kê thẳng, không còn ô "Cài đặt tài khoản" (lượt 41328397457).
- extendedWaitUntil:
    visible: "Tài khoản của tôi"
    timeout: 20000
- takeScreenshot: 06-khac
# Quy định 5.1.1(v): xoá tài khoản ngay trong app (chỉ kiểm tra có nút, không xoá thật).
- scrollUntilVisible:
    element: "Xoá tài khoản"
    direction: DOWN
    timeout: 20000
- tapOn: "Xoá tài khoản"
- extendedWaitUntil:
    visible: "Xem chi tiết"
    timeout: 20000
- takeScreenshot: 06-xoa-tai-khoan
# Về trang Tài khoản bằng nút kính "Quay lại" ở chỗ logo (chữ "Tài khoản" trùng tiêu đề trang, không dùng để bấm).
# Đầu trang cuộn theo trang: cuộn ngược lên tới khi thấy nút (trang Cài đặt mở ở thẻ Xoá tài khoản cuối trang).
- scrollUntilVisible:
    element: "Quay lại"
    direction: UP
    timeout: 20000
- tapOn: "Quay lại"
- scrollUntilVisible:
    element: "Tài khoản của tôi"
    direction: UP
    timeout: 20000
- scrollUntilVisible:
    element: "Hỗ trợ"
    direction: DOWN
    timeout: 20000
- tapOn: "Hỗ trợ"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 06-ho-tro
# Về trang Tài khoản bằng nút kính "Quay lại" ở chỗ logo (chữ "Tài khoản" trùng tiêu đề trang, không dùng để bấm).
# Đầu trang cuộn theo trang: cuộn ngược lên tới khi thấy nút (trang Cài đặt mở ở thẻ Xoá tài khoản cuối trang).
- scrollUntilVisible:
    element: "Quay lại"
    direction: UP
    timeout: 20000
- tapOn: "Quay lại"
- scrollUntilVisible:
    element: "Tài khoản của tôi"
    direction: UP
    timeout: 20000
- scrollUntilVisible:
    element: "Chính sách bảo mật"
    direction: DOWN
    timeout: 20000
- tapOn: "Chính sách bảo mật"
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 06-chinh-sach-bao-mat
# Về trang Tài khoản bằng nút kính "Quay lại" ở chỗ logo (chữ "Tài khoản" trùng tiêu đề trang, không dùng để bấm).
