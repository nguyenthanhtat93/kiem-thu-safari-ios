# Đo vị trí con trỏ so với chữ gợi ý của textarea trên Safari iOS thật. Chạy tay: gh workflow run con-tro.yml
name: Con trỏ textarea iOS
on: workflow_dispatch
jobs:
  con-tro:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: sudo safaridriver --enable
      - run: |
          name="$(xcrun simctl list devices available | grep -E 'iPhone 1[0-9] Pro Max' | tail -1 | sed -E 's/^ *(.*) \([0-9A-F-]{36}\).*/\1/')"
          udid="$(xcrun simctl list devices available | grep -F "$name (" | tail -1 | grep -oE '[0-9A-F-]{36}')"
          echo "$name $udid"
          xcrun simctl boot "$udid" || true; xcrun simctl bootstatus "$udid" -b || true
          for key in RemoteAutomationEnabled WebKitRemoteAutomationEnabled WebKitInspectorEnabled WebInspectorEnabled; do
            xcrun simctl spawn "$udid" defaults write com.apple.mobilesafari "$key" -bool YES
            xcrun simctl spawn "$udid" defaults write com.apple.WebInspector "$key" -bool YES
          done
          xcrun simctl terminate "$udid" com.apple.mobilesafari || true
          node con-tro/chay.mjs "$name" "$udid"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: con-tro, path: .scratch/con-tro, retention-days: 3 }
